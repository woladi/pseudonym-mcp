name: Release

# Two-phase release, driven by changesets — the same model as macos-vision-mcp:
#
#   · pending `.changeset/*.md` files      → open / update a "version packages"
#                                             PR that bumps package.json,
#                                             server.json, src/version.ts and
#                                             CHANGELOG.md.
#   · that PR merged (no changesets left)  → `npm run release`
#                                             (= build + `changeset publish`)
#                                             → npm publish, git tag, GitHub
#                                             Release. Then the MCP registry
#                                             entry is refreshed.
#
# The previous pipeline ran release-it on every push with `git.push: false`, so
# the bump commit never landed: the repo sat at 0.2.5 while npm was at 0.7.4 and
# the server reported 0.2.5 to its clients. Here the bump arrives as a normal
# PR, and a push with no changesets publishes nothing at all.
#
# Auth to npm is Trusted Publishing (OIDC) — there is NO NPM_TOKEN secret.
# Provenance is opt-in via package.json#publishConfig.provenance.
#
# Prerequisite (one-off, npm web UI):
#   npmjs.com → Package → Settings → Trusted Publishers
#     owner=woladi · repo=pseudonym-mcp · workflow=release.yml
#     environment= (leave empty)

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      publish_registry:
        description: 'Re-publish the current server.json to the MCP registry (npm published but the registry step failed)'
        type: boolean
        default: false

# contents:      changesets/action commits the version PR and creates the
#                GitHub Release at publish time
# pull-requests: …and opens / updates that PR
# id-token:      OIDC for npm Trusted Publishing + provenance
permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      published: ${{ steps.changesets.outputs.published }}
      version: ${{ steps.published-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          # registry-url makes the npm CLI request an OIDC token from the
          # runner and exchange it with the registry.
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci
        env:
          HUSKY: 0

      - run: npm run lint
      - run: npm run build
      - run: npm run test:run

      # npm bundled with Node 22 (10.x) predates OIDC Trusted Publishing, and
      # setup-node injects a placeholder `_authToken` when registry-url is set —
      # publishing with `XXXXX-XXXXX-…` makes the registry answer 404.
      - name: Prepare npm for OIDC trusted publishing
        run: |
          npm install -g npm@latest
          npm --version
          npm config delete //registry.npmjs.org/:_authToken || true

      - id: changesets
        uses: changesets/action@v1
        with:
          version: npm run version-packages
          publish: npm run release
          title: 'chore(release): version packages'
          commit: 'chore(release): version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # NPM_TOKEN intentionally absent — Trusted Publishing handles auth.

      - id: published-version
        if: steps.changesets.outputs.published == 'true'
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

  publish-registry:
    name: Publish to MCP Registry
    needs: release
    # The registry validates the manifest only at publish time, i.e. after npm
    # has already gone out — so this job can fail on its own and leave the
    # registry a version behind. `workflow_dispatch` with publish_registry
    # re-runs just this half against whatever server.json currently says.
    if: needs.release.outputs.published == 'true' || inputs.publish_registry
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write # passwordless GitHub OIDC login to the registry
      contents: read
    steps:
      - uses: actions/checkout@v4

      # server.json is bumped in the version PR by scripts/sync-version.js, so
      # after a release it should already match. On a manual re-run there is no
      # released version to compare against and server.json itself is the
      # source of truth.
      - name: Resolve the version to publish
        id: target
        env:
          RELEASED: ${{ needs.release.outputs.version }}
        run: |
          VERSION="${RELEASED:-$(node -p "require('./server.json').version")}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "publishing $VERSION"

      # Fail loudly rather than point the registry at something npm does not
      # have — either because the manifest is stale, or because a manual re-run
      # was fired before the matching npm publish landed.
      - name: Verify server.json matches a published npm version
        env:
          VERSION: ${{ steps.target.outputs.version }}
        run: |
          node -e '
            const s = require("./server.json");
            const v = process.env.VERSION;
            const bad = [s.version, s.packages[0].version].filter(x => x !== v);
            if (bad.length) {
              console.error(`server.json is at ${s.version}/${s.packages[0].version}, expected ${v} — run npm run sync-version`);
              process.exit(1);
            }
            console.log(`server.json is in sync at ${v}`);
          '
          npm view "pseudonym-mcp@$VERSION" version

      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar -xz mcp-publisher
          sudo install mcp-publisher /usr/local/bin/mcp-publisher
          mcp-publisher --version || true

      - name: Log in to the MCP Registry (GitHub OIDC)
        run: mcp-publisher login github-oidc

      - name: Publish
        run: mcp-publisher publish
